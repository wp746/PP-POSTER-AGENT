[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-poster-agent"
version = "0.1.0"
description = "Portable, evidence-gated food and event KV production agent"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.3,<13", "fonttools>=4.59,<5", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "build>=1.2,<2", "setuptools>=68", "wheel>=0.45"]

[project.scripts]
poster = "poster_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
